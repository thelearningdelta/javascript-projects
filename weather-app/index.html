<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="author" content="thelearningdelta" description="Weather App" />
</head>

<body>

  <div class="weather-app">
    <h1>Weather App</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city..." />
      <button id="searchBtn">Search</button>
    </div>

    <div class="weather-card hidden" id="weatherCard">
      <img id="weatherIcon" src="" alt="Weather Icon" class="weather-icon" />

      <h2 id="cityName">London, GB</h2>

      <div class="temp" id="temperature">18°C</div>

      <p id="description">Scattered Clouds</p>

      <div class="weather-info">
        <div>
          <span>💧</span>
          <h3 id="humidity">72%</h3>
          <p>Humidity</p>
        </div>

        <div>
          <span>🌬️</span>
          <h3 id="wind">4.6 m/s</h3>
          <p>Wind Speed</p>
        </div>

        <div>
          <span>🌡️</span>
          <h3 id="minmax">14° / 20°</h3>
          <p>Min / Max</p>
        </div>
      </div>
    </div>

    <p class="error hidden" id="errorMsg"></p>
  </div>

  <script src="script.js"></script>
</body>

</html>
